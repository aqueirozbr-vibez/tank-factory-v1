# Task risk classification instrument (PRD §Task risk classification).
# A task's risk is the strongest change class its Scope touches, not the sum;
# the base score is adjusted multiplicatively; the governed class is decided by
# path and never by score. Tier letters come from the planner's
# risk_inputs.tiers_touched plus any Scope path matching a tier's `paths`
# prefixes. `examples` describe each tier for the planner and the tech lead;
# code does not match them (a billing path the Scope did not name is a
# tech-lead override, PRD worked example 5). Recalibrated monthly against
# tech-lead overrides.
version: 1
tiers:
  A:
    name: Governed
    base: 100
    paths: [".factory/", ".claude/", ".github/workflows/", "tests/acceptance/", "CODEOWNERS"]
    examples:
      - authentication
      - authorisation
      - secrets handling
      - billing
      - a migration that drops or rewrites data
    destructive_migration: true
  B:
    name: Data and contracts
    base: 70
    examples:
      - additive schema migration
      - public API, CLI or webhook contract
      - permission checks
      - background job scheduling
  C:
    name: Application logic
    base: 40
    examples:
      - service and domain logic
      - the product's own agent prompts and tools
      - error handling on a stated path
  D:
    name: Leaf change
    base: 20
    examples:
      - UI copy
      - logging
      - an internal refactor with no behaviour change
      - new unit or integration tests
  E:
    name: Docs and config
    base: 10
    paths: ["README", "docs/"]
    examples:
      - non-secret configuration values
      - a dependency version bump already in the lockfile
  U:
    name: Unclassifiable
    base: 0
    examples:
      - Scope names no paths
      - Scope names paths that do not exist in the repository
size:
  thresholds: [100, 500]        # changed lines <= 100 / 101-500 / > 500
  multipliers: [1.0, 1.3, 1.6]
blast_radius:
  thresholds: [1, 3]            # modules touched 1 / 2-3 / >= 4
  multipliers: [1.0, 1.2, 1.5]
new_dependency:
  none: 1.0
  any: 1.5
thresholds:
  high: 50                      # score >= 50: human plan approval before build
  low_floor: 1                  # below 1 (tier U at 0): blocked for spec correction
governed:
  tier: A
  destructive_migration: true
  new_secret: true
  budget_request_over_default_factor: 2
