# The shipped roster: the default pair (PRD §Architecture · Roster).
# Planner and builder on Claude Code (Anthropic); reviewer on Codex (OpenAI).
# An installation may replace either vendor as long as two remain.
# Model ids are pinned here and recorded on every phase row.
planner:
  harness: claude_code
  model: claude-opus-5-5
  thinking: high
  tools: [Read, Glob, Grep, Write, Edit]
  writes: ["specs/"]
  max_turns: 40
  phase_cap_usd: 1.50
  timeout_s: 1800
builder:
  harness: claude_code
  model: claude-opus-5-5
  thinking: medium
  tools: [Read, Glob, Grep, Write, Edit, Bash]
  writes: ["**"]
  max_turns: 80
  phase_cap_usd: 3.00
  timeout_s: 7200
reviewer:
  harness: codex
  model: gpt-5-codex
  tools: [Read, Glob, Grep]
  writes: []
  max_turns: 40
  phase_cap_usd: 1.50
  timeout_s: 2700
