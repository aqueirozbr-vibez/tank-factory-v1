# One installation on one VM (TRD §2.4, §11): orchestrator, model proxy, edge, under one
# systemd unit. `factory install` writes /etc/factory/factory.env (this file's variables and
# the orchestrator's settings) and /etc/factory/proxy.env (the master key and the vendor
# keys, which reach the proxy container and nothing else). Run as:
#   docker compose -f deploy/docker-compose.yml --env-file /etc/factory/factory.env up -d
services:
  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: factory-orchestrator:${FACTORY_VERSION:-local}
    env_file:
      - ${FACTORY_ETC_DIR:-/etc/factory}/factory.env
    volumes:
      # The data volume at the same path inside and outside: the worktrees it bind-mounts
      # into task containers are host paths the docker daemon resolves.
      - ${FACTORY_DATA_DIR:-/var/lib/factory}:${FACTORY_DATA_DIR:-/var/lib/factory}
      - ${FACTORY_ETC_DIR:-/etc/factory}:${FACTORY_ETC_DIR:-/etc/factory}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${FACTORY_API_PORT:-8080}:8080"  # the factory CLI's controls, loopback only
    networks:
      - factory-app
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  litellm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - litellm-db:/var/lib/postgresql/data
    networks:
      - factory-app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/config/config.yaml", "--port", "4000"]
    env_file:
      - ${FACTORY_ETC_DIR:-/etc/factory}/proxy.env  # LITELLM_MASTER_KEY and the vendor keys
    environment:
      DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
      LITELLM_LOG: WARNING
    volumes:
      - ./litellm/config.yaml:/config/config.yaml:ro
    networks:
      factory-app: {}
      factory-tasks:
        aliases: [proxy]  # the only host a task container can reach
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "443:443"
      - "80:80"  # ACME challenges for the public host; nothing is served here
    environment:
      FACTORY_CONSOLE_HOST: ${FACTORY_CONSOLE_HOST:-factory.internal}
      FACTORY_PUBLIC_HOST: ${FACTORY_PUBLIC_HOST:-localhost}
      FACTORY_ACME_EMAIL: ${FACTORY_ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - factory-app
    depends_on:
      - orchestrator
    restart: unless-stopped

  # console: reserved for phase 5 (Next.js on :3000 behind the internal listener).

volumes:
  litellm-db:
  caddy-data:
  caddy-config:

networks:
  factory-app:
    name: factory-app
  factory-tasks:
    external: true  # created --internal by `factory install` (ensure_network)
