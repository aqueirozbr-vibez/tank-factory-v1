[project]
name = "factory"
version = "0.1.0"
description = "Tank Factory v1: orchestrator, installer CLI and prompts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=43",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyjwt>=2.9",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
  "uvicorn>=0.30",
]

[project.scripts]
factory = "cli.main:main"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "hypothesis>=6.100",
  "types-pyyaml>=6.0.12.20260906",
  "pytest-asyncio>=0.24",
  "schemathesis>=4.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "cli"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "orchestrator/migrations"
"prompts" = "orchestrator/prompts"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = [".venv", "node_modules", "fixtures/known_failing"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["orchestrator", "cli"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["orchestrator", "cli", "tests"]
exclude = ["(^|/)fixtures/known_failing/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
